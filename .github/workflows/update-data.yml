name: Update SLF data

on:
  schedule:
    - cron: "7 * * * *"   # every hour, a few minutes past
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch SLF data
        run: node scripts/fetch.mjs
      - name: Save data if it changed
        run: |
          git config user.name "ski-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update SLF data"
            git push
          fi
